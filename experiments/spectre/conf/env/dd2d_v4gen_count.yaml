# DD2D held-out generalization set — UNSEEN ITEM COUNT, old shape library.
#
# A test-only collection (docs/decisions 2026-08-01) for the DD2D generalization
# experiment. Same domain / generator / refiner as dd2d_v4, but with two things the
# dd2d_v4-trained model never saw:
#   * item count 14–16 (= 13–15 blockers), strictly above the trained 10–13 items
#     (9–12 blockers). A realized-count floor guarantees every kept scene has >= 14
#     items, so no problem falls back into the seen count range.
#   * a modest fill-cap bump (fill_max=0.72) so the denser scenes actually place.
# The shape library is the base 7 families (no tee/cross) — this set isolates the
# count effect. See dd2d_v4gen_shape for the count+new-shape set.
#
# Collected with:
#   python -m alphatamp.approaches.spectre.envs.dd2d.drawer.collect \
#     --out-root data/dd2d/raw_v4gen_count --splits test --seed-band-base 3 \
#     --target-test 40 --n-items-min 14 --n-items-max 16 --fill-max 0.72
# then converted (test split only) and scored against the dd2d_v4 vocab + checkpoints
# (train-old / test-new): spectre_score_v3.py --env-variant dd2d_v4 \
#   --test-variant dd2d_v4gen_count --astar-baseline ...
#
# As with v2/v3/v4 the data is wired via the JSON->EpisodeRecord converter, not a live
# SesameModels env; env_id / model_name / model_kwargs are unused placeholders.
env_id: "dd2d/DrawerDeclutter2D-v0"
env_variant: "dd2d_v4gen_count"
model_name: "dd2d"
model_kwargs: {}
