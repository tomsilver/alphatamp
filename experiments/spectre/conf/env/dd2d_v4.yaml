# DD2D (Drawer Decluttering 2D) — SPECTRE env variant, v4 collection.
#
# Same domain, generator and refiner settings as dd2d_v3 (lam=0.8, crowd=5,
# k=200, retry_cap=10, samples_per_step=15, time_budget=20.0). What v4 adds is
# **refiner instrumentation**: every failed refinement now carries typed
# observations — which objects the fingers actually collided with (culprits),
# per-step sampler effort, whether the sampler exhausted its own retries or the
# global budget stopped it, and the unmoved set U(sigma, j). It also persists
# per-candidate wall-clock (`elapsed`), the backjump count, and the generator
# arguments. Those are what the v3 adaptive pathway consumes instead of
# recomputing geometry post-hoc.
#
# The instrumentation is observation-only — verified differentially against the
# pre-instrumentation refiner, labels identical on 290/290 replays — but v4 is
# **not** a byte-identical re-run of v3, because DD2D's problem *generator* is
# PYTHONHASHSEED-dependent (same seed + same parameters can yield a different
# scene in a different process). Measured over 597 matched problems: 99.2%
# identical scenes, 94.6% identical labels, 86.9% fully identical; 0.08% of
# candidate labels differ. That divergence is a known, accepted, documented
# property of this collection — see `docs/decisions.md` 2026-07-26 — not an
# effect of the instrumentation.
#
# Practical consequence: v4 numbers are comparable to v3 numbers at the ~0.1%
# label level, which is far below seed noise, but the two are separate variants
# so they can never be silently averaged into one row.
#
# As with v2/v3 the dataset is wired in via the JSON->EpisodeRecord converter
# (experiments/spectre/dd2d_convert.py), not a live SesameModels env, so
# env_id / model_name / model_kwargs are placeholders unused by the training
# pipeline; only env_variant selects the on-disk data layout + policy tables.
env_id: "dd2d/DrawerDeclutter2D-v0"
env_variant: "dd2d_v4"
model_name: "dd2d"
model_kwargs: {}
