# VLMPlan baseline — zero-shot VLM plan generation + scoring.
#
# Environment-agnostic since 2026-08-01: `env` selects the collection and
# `vlmplan/registry.py` picks the adapter and the off-pool labeler from it. DD2D and
# StickButton2D are wired; a third environment is a registry entry.
#
# Two entry points share this config, and the split between them is deliberate:
#   vlmplan_run.py    queries the model, writes transcripts + proposal sequences
#   vlmplan_score.py  labels those sequences, writes the compare-cache record
# Generation is the expensive, model-dependent half; scoring is free and local. So a
# re-collection (or a scoring change) re-runs only the second stage, and a prompt-identical
# problem hits the prpl_llm_utils response cache.

defaults:
  - env: dd2d_v3
  - _self_

data_root: "data/spectre"
split: "train"

# Problem selection. n_problems <= 0 means the whole split. Problems are taken in
# sorted-problem-id order so a subset is reproducible. `stratified_per_stratum > 0` takes
# that many problems from EACH stratum instead (stride, never truncate — the strata are
# contiguous problem-id bands, so n_problems=40 would be all one stratum). Explicit
# `problem_ids` win over both.
n_problems: 5
problem_ids: []
stratified_per_stratum: 0

# Run identity. Generation writes under <data_root>/derived/<env_variant>/vlmplan/<run>/;
# scoring writes the comparison row into the compare cache under `cache_subdir`.
run: "qwen3vl8b"
seed: 0
cache_subdir: "vlmplan"

# ---------------------------------------------------------------------------
# Model. Local dev arm = an OpenAI-compatible server (LM Studio / vLLM):
#   lms server start
#   export OPENAI_BASE_URL=http://localhost:1234/v1 OPENAI_API_KEY=lm-studio
# Switching to a frontier API arm is a change to `model` only.
# ---------------------------------------------------------------------------
model:
  backend: "openai" # openai | openai_responses | gemini
  model_name: "qwen3-vl-8b-instruct"
  cache_kind: "sqlite"
  # Per-collection, so two environments' prompt caches never collide. The response
  # cache is keyed on the prompt, so a re-run of an identical problem is free.
  cache_path: "data/spectre/derived/${env.env_variant}/vlmplan_cache.db"
  base_url: null # null -> take OPENAI_BASE_URL from the environment
  decode:
    # NOT 0.0: this loop wants diverse plans across rounds, and at temperature 0 a round
    # that yields nothing leaves the next round with a byte-identical prompt. KinDER's own
    # runs also use temperature 1. loop.py additionally varies `seed` per round.
    temperature: 1.0
    # 8192, not 4096. At 4096 the 2026-07-24 smoke run truncated 16/104 completions
    # (completion_tokens == the cap exactly) and total_tokens hit the 8192 server window
    # exactly, so plans were being cut mid-block and silently dropped by the parser. Load
    # the model with a >= 32768 context to match, and watch `n_truncated` in the record.
    max_tokens: 8192

# Attach the labelled top-down render (the VLMPlan arm). false = the LLMPlan text-only
# arm, from the identical prompt.
with_images: true
image_width_px: 1024
# Which scene image the model sees. "schematic" = the spectre-drawn vector render (both
# envs). "kinder_labeled" = kinder's own environment pixels with Set-of-Mark labels
# overlaid (StickButton2D only; DD2D ignores it). See vlmplan/registry.make_adapter.
image_source: "schematic"

# ---------------------------------------------------------------------------
# Generation loop. Pilot on the train split, then FREEZE these before touching test.
# ---------------------------------------------------------------------------
loop:
  max_plans: 200 # = the pool cap, so protocol parity with the other methods
  plans_per_round: 10
  tau: 0.2 # stall if new-unique-valid yield rate drops below this ...
  stall_rounds: 2 # ... for this many consecutive rounds
  max_rounds: 12
  max_retries: 3
  retry_backoff_s: 2.0

# ---------------------------------------------------------------------------
# Scoring
# ---------------------------------------------------------------------------
attempt_budget: 200 # uncensored: = pool cap (decisions.md 2026-06-07)

# Per-candidate refinement cap (seconds) for the wall-clock section's capped column — the
# deployed DD2D value (decisions/07 2026-08-02). Every attempt is charged at most this many
# seconds of refinement; the uncapped FP headline is unaffected.
refine_cap_s: 2.0

# Stop generating once a proposal is known to refine. `loop.max_plans` is a hard ceiling
# for the case where every proposal fails, not a quota -- proposals produced after the
# first success can never change FP, since the rollout stops there. Set false to
# reproduce the pre-2026-08-01 behaviour (the DD2D rows were generated that way).
stop_at_first_success: true
fill_from_published: true # exhausted episodes degrade to astar-dist, not to a missing value
overwrite: false

# Consistency gate: re-label stored pool plans live and compare to the stored outcome.
# Well below 1.0 means the env code moved since the collection, so in-pool and off-pool
# attempts are on different label functions and no number should be reported.
check_label_agreement: true
label_agreement_episodes: 12
label_agreement_samples: 4

hydra:
  job:
    chdir: false
