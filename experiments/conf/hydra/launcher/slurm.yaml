_target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher

# Slurm job settings for Princeton Della.
partition: cpu
timeout_min: 240       # 4 hours; LLM approaches can be slow across many seeds
cpus_per_task: 1       # planning is single-threaded
mem_gb: 8
gpus_per_node: null
nodes: 1
tasks_per_node: 1

# Hydra-managed paths.
submitit_folder: ${hydra.sweep.dir}/.submitit/%j
name: ${hydra.job.name}
