defaults:
  - env: obstruction2d
  - approach: box
  - _self_

seed: 123
levels: ["o0", "o1", "o2", "o3", "o4"]
train_seed_start: 100
test_seed_start: 1000
num_train_seeds: 25
num_test_seeds: 10
output_dir: box_matrix_outputs
make_plot: true
plot_filename: box_approach_performance_summary.png

approach:
  training_label_mode: effort
  failure_penalty_multiplier: 1.0

complexity_configs:
  o0:
    timeout: 20
    max_abstract_plans: 10
  o1:
    timeout: 30
    max_abstract_plans: 15
  o2:
    timeout: 40
    max_abstract_plans: 20
  o3:
    timeout: 50
    max_abstract_plans: 25
  o4:
    timeout: 60
    max_abstract_plans: 30
