defaults:
  - _self_

bootstrap:
  enabled: true
  env_id: kinder/Obstruction2D-o2-v0
  model_name: obstruction2d
  num_obstructions: 2

data:
  train_path: artifacts/encoder_o2/encoder_train_filtered_dataset.pkl
  val_path: artifacts/encoder_o2/encoder_validation_filtered_dataset.pkl
  test_path: artifacts/encoder_o2/encoder_test_filtered_dataset.pkl

model:
  # hidden_dims: [128, 32, 8, 32, 128]
  # hidden_dims: [128, 64]
  hidden_dims: [128, 32, 16, 32, 128]
  dropout: 0.1
  use_layer_norm: true

train:
  target_mode: steps  # "steps" (soft-label BCE on steps_completed_fraction) or "binary" (BCE on success)
  seed: 0
  device: auto
  num_epochs: 300
  batch_size: 32
  num_masks: 4
  lr: 0.0002
  weight_decay: 0.0001
  grad_clip_norm: 1.0

val:
  mask_seed: 12345
  num_masks: 10

metrics:
  top_k_values: [1, 2]

rollout:
  seed: 2026
  static_first_index: null

test:
  mask_seed: 22345
  num_masks: 10
  rollout_seed: 3036

checkpoint:
  output_dir: artifacts/encoder_o2
  best_filename: encoder_o2_best.pt
  last_filename: encoder_o2_last.pt

log_every_steps: 20
