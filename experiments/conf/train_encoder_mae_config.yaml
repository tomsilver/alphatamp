defaults:
  - _self_

bootstrap:
  enabled: true
  env_id: kinder/Obstruction2D-o2-v0
  model_name: obstruction2d
  model_kwargs:
    num_obstructions: 2

data:
  train_path: artifacts_ob/encoder_o2/encoder_train_filtered_dataset.pkl
  val_path: artifacts_ob/encoder_o2/encoder_validation_filtered_dataset.pkl
  test_path: artifacts_ob/encoder_o2/encoder_test_filtered_dataset.pkl

model:
  arch: transformer
  embed_dim: 32
  n_heads: 4
  n_layers: 2
  ffn_dim_multiplier: 4
  dropout: 0.1
  use_id_embed: false
  # MLP ablation (set arch: mlp to use):
  # hidden_dims: [128, 32, 16, 32, 128]
  # use_layer_norm: true

train:
  target_mode: binary  # "steps" (soft-label BCE on steps_completed_fraction) or "binary" (BCE on success)
  seed: 0
  device: auto
  num_epochs: 100
  batch_size: 32
  num_masks: 4
  lr: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  pairwise_lambda: 0.5  # 0.0 = pure BCE; >0 adds pairwise ranking loss

val:
  mask_seed: 12345
  num_masks: 10

metrics:
  top_k_values: [1, 2]

rollout:
  seed: 2026
  static_first_index: null

test:
  mask_seed: 22345
  num_masks: 10
  rollout_seed: 3036

checkpoint:
  output_dir: artifacts_ob/encoder_o2
  best_filename: encoder_o2_best.pt
  last_filename: encoder_o2_last.pt

log_every_steps: 20
