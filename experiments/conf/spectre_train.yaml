defaults:
  - env: routedtransport2d_n3_v1
  - _self_

seed: 0
data_root: "data/spectre"
out_dir: "data/spectre/checkpoints"

train:
  # Optimizer + schedule (spec §8.4)
  lr: 1e-4
  weight_decay: 5e-4
  beta1: 0.9
  beta2: 0.999
  batch_size: 16
  epochs: 100
  warmup_steps: 500
  lr_min: 1e-5
  grad_clip: 1.0

  # Regularization
  prior_dropout_p: 0.2
  augment: true

  # F-sampling (spec §8.2 default rollout_aligned_mix)
  f_sampling_mode: "rollout_aligned_mix"
  f_sampling_mix_weights: [0.25, 0.25, 0.5]
  f_sampling_log_normal_mu: 0.0
  f_sampling_log_normal_sigma: 1.0

  # F-subsample multiplier (spec §8.1 fix #5)
  num_f_samples_per_epoch: 4
  num_f_samples_per_val_episode: 4

  # Reproducibility (overridden by top-level cfg.seed at instantiation)
  seed: 0

  # Validation
  auroc_t_max: 3

  # DataLoader
  num_workers: 0

hydra:
  job:
    chdir: false
