[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "alphatamp"
version = "0.1.0"
description = "Learning to accelerate TAMP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
   "prpl_utils@git+https://github.com/Princeton-Robot-Planning-and-Learning/prpl-mono.git@df145d5c509f24933670270d3759b25918662e01#subdirectory=prpl-utils",
   "prpl_llm_utils@git+https://github.com/Princeton-Robot-Planning-and-Learning/prpl-mono.git@df145d5c509f24933670270d3759b25918662e01#subdirectory=prpl-llm-utils",
   "tomsgeoms2d@git+https://github.com/Princeton-Robot-Planning-and-Learning/prpl-mono.git@df145d5c509f24933670270d3759b25918662e01#subdirectory=toms-geoms-2d",
   "relational_structs@git+https://github.com/Princeton-Robot-Planning-and-Learning/prpl-mono.git@df145d5c509f24933670270d3759b25918662e01#subdirectory=relational-structs",
   "seaborn>=0.12.0",
   "types-seaborn>=0.13.2",
   "scikit-learn",
   "torch",
   "pymunk==7.1.0",
   "scipy-stubs",
   "hydra-joblib-launcher",
   "hydra-submitit-launcher",
   "kinder-bilevel-planning",
   "bilevel-planning",
   "kinder-models",
   "kindergarden[kinematic2d]==0.0.8",
]

[project.optional-dependencies]
develop = [
    "black",
    "docformatter",
    "isort",
    "marimo",
    "mypy",
    "pylint>=2.14.5",
    "pytest-pylint>=0.18.0",
    "pytest>=7.2.2",
    "wandb"
]
# Tote-and-Tray Decluttering benchmark (self-contained sub-project under
# approaches/spectre/ttd/). Shapely is the authoritative 2D-geometry layer; the
# version is pinned per TTD_SPEC_v1.3 §12.3 ("versions pinned Shapely/GEOS").
# pybullet / scikit-learn / etc. are added by the later chunks that need them.
ttd = [
    "shapely>=2.0,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alphatamp = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
py_version = 311
profile = "black"
multi_line_output = 2
skip_glob = ["venv/*", ".venv/*"]
split_on_trailing_comma = true

[tool.docformatter]
line-length = 88
wrap-summaries = 88
wrap-descriptions = 88

[tool.mypy]
strict_equality = true
disallow_untyped_calls = true
warn_unreachable = true
exclude = [
    "venv/*",
    ".venv/*",
    "experiments/spectre/analyze_spectre\\.py$",
    "experiments/spectre/compare_dd2d_methods\\.py$",
    "experiments/spectre/precompute_dd2d_cache\\.py$",
    # Vendored DD2D environment (migrated from the envsearch repo, see
    # envs/dd2d/MIGRATION_DD2D.md). Excluded from strict mypy like lib/ vendoring;
    # the negative lookahead keeps SPECTRE's own adapter (spectre_operators.py,
    # spectre_convert.py) type-checked.
    "src/alphatamp/approaches/spectre/envs/dd2d/(?!spectre_)",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.uv.sources]
kinder-bilevel-planning = { git = "https://github.com/Princeton-Robot-Planning-and-Learning/kinder-baselines.git", subdirectory = "kinder-bilevel-planning" }
bilevel-planning = { git = "https://github.com/Princeton-Robot-Planning-and-Learning/prpl-mono.git", subdirectory = "bilevel-planning" }
kinder-models = { git = "https://github.com/Princeton-Robot-Planning-and-Learning/kinder-baselines.git", subdirectory = "kinder-models" }

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "sklearn.*",
    "shapely.*",
]
ignore_missing_imports = true
